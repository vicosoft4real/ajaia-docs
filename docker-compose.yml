services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ajaia_docs
      POSTGRES_USER: ajaia_docs
      POSTGRES_PASSWORD: ajaia_docs_dev
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajaia_docs -d ajaia_docs"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ajaia_docs;Username=ajaia_docs;Password=ajaia_docs_dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
